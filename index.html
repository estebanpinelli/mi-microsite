<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tipografías de la nueva dirección visual: Fraunces (serif editorial,
         para títulos) y Work Sans (sans limpia, para el cuerpo de texto).
         El preconnect adelanta la conexión a los dos dominios de Google
         Fonts antes de que el navegador sepa que los va a necesitar, así
         la tipografía llega un poco más rápido. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Estas etiquetas de acá abajo (title + description + Open Graph) son
         el "respaldo de fábrica": lo que ve cualquiera que NO ejecute el
         JavaScript del sitio (buscadores viejos, o el instante antes de que
         React termine de cargar) — todas marcadas con data-default="true".
         Apenas React arranca, src/components/Seo.jsx las reemplaza por la
         versión específica de la página en la que estás (ver ese archivo
         para el porqué). Si algún día se suma pre-renderizado, estas mismas
         etiquetas pasan a ser las reales para Home. -->
    <title data-default="true">Exóticos | Viajes privados y de lujo a Japón, Islandia, Egipto, China, Bali y África</title>
    <meta data-default="true" name="description" content="Exóticos diseña viajes privados y en grupos reducidos a destinos como Japón, Islandia, Egipto, China, Bali y safaris africanos, para viajeros que buscan experiencias auténticas y a medida." />

    <!-- Open Graph -->
    <meta data-default="true" property="og:type" content="website" />
    <meta property="og:site_name" content="Exóticos" />
    <meta data-default="true" property="og:title" content="Exóticos | Viajes privados y de lujo a destinos exóticos" />
    <meta data-default="true" property="og:description" content="Viajes privados y en grupos reducidos a Japón, Islandia, Egipto, China, Bali y safaris africanos. Experiencias a medida para viajeros exigentes." />
    <meta data-default="true" property="og:image" content="/desierto.jpg" />

    <!-- Datos estructurados (schema.org): le dicen a Google, en un formato
         que entiende directamente (no tiene que "adivinar" leyendo el
         texto de la página), qué tipo de negocio es este sitio y sus datos
         de contacto reales. No cambia nada visual, es solo para buscadores. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Exóticos",
        "alternateName": "Lomas Turismo",
        "url": "https://viajesexoticoslt.com/",
        "logo": "https://viajesexoticoslt.com/logotr.png",
        "image": "https://viajesexoticoslt.com/desierto.jpg",
        "description": "Exóticos diseña viajes privados y en grupos reducidos a destinos como Japón, Islandia, Egipto, China, Bali y safaris africanos, para viajeros que buscan experiencias auténticas y a medida.",
        "email": "exoticos@lomasturismo.com",
        "telephone": "+5491166194844",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Loria 449",
          "postalCode": "C2587ABC",
          "addressLocality": "Lomas de Zamora",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        },
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61551028650874",
          "https://www.instagram.com/lomasturismoexoticos/?next=%2F"
        ]
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8C3TS2L7CP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8C3TS2L7CP');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wrfke3ne4f");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
